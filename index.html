<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Login</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/light-mode.css">
</head>
<body>
    <div class="auth-container">
        <img src="img/logo.png" alt="Roblox Logo" class="auth-logo">
        <h2>Login to Ro-Store</h2>
        
        <p id="errorMessage" style="color: #ff4d4d; display: none; margin-bottom: 10px;"></p>

        <form id="loginForm">
            <input type="text" id="usernameInput" placeholder="Username" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <button type="submit" class="btn-roblox">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <!-- Đường dẫn chính xác đến thư mục javaScript -->
    <script src="js/login.js"></script>
</body>
</html>
