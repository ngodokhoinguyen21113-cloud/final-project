<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Register</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/light-mode.css">
</head>
<body>
    <div class="auth-container">
        <img src="img/logo.png" alt="Roblox Logo" class="auth-logo">
        <h2>Create Account</h2>

        <p id="errorMessage" style="color: #ff4d4d; display: none; margin-bottom: 10px;"></p>

        <form id="registerForm">
            <input type="text" id="usernameInput" placeholder="Username" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <input type="password" id="confirmPasswordInput" placeholder="Confirm Password" required>
            <button type="submit" class="btn-roblox">Register</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="index.html">Log In</a></p>
    </div>

    <!-- Đường dẫn chính xác đến thư mục javaScript -->
    <script src="js/register.js"></script>
</body>
</html>
