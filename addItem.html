<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Add Item</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/light-mode.css">
</head>

<body>
    <div class="home-container">
        <!-- Navbar chứa Logo và Log Out -->
        <header class="navbar">
            <div class="logo-container" style="margin-bottom: 0; cursor: pointer;"
                onclick="window.location.href='home.html'">
                <img src="img/logo.png" alt="Roblox Logo" class="nav-logo">
            </div>
            <div class="user-info">
                <span>Welcome, <strong id="displayUsername">Player</strong>!</span>
                <div class="nav-menu-wrapper">
                    <img id="navAvatar" class="nav-avatar" src="img/default-avartar.png" alt="Avatar" style="cursor: pointer;" onclick="window.location.href='profile.html'" onerror="this.src='img/default-avartar.png'">
                    <button id="navMenuBtn" class="btn-hamburger" aria-label="Menu">☰</button>
                    <div id="navDropdown" class="nav-dropdown">
                        <button onclick="window.location.href='profile.html'">👤 My Profile</button>
                        <button onclick="window.location.href='favorites.html'">❤ Favorites</button>
                        <button onclick="window.location.href='home.html'">🏠 Home</button>
                        <button onclick="window.location.href='manageItems.html'">📦 Manage Items</button>
                        <button onclick="window.location.href='settings.html'">⚙ Settings</button>
                        <button id="logoutBtn">🚪 Log Out</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Form nhập vật phẩm -->
        <main class="content">
            <div class="auth-container" style="margin: 20px auto;">
                <h2>Add New Item</h2>

                <form id="addItemForm">
                    <label>Item Name:</label>
                    <input type="text" id="itemName" required placeholder="Enter item name">

                    <label>Price (Robux):</label>
                    <input type="number" id="itemPrice" min="0" required placeholder="0">

                    <label>Description:</label>
                    <textarea id="itemDesc" placeholder="Enter description"></textarea>

                    <!-- Tùy chọn 1: Chọn ảnh từ máy -->
                    <label>Upload Image from Device:</label>
                    <div class="custom-file-upload">
                        <input type="file" id="itemFileInput" accept="image/*">
                        <label for="itemFileInput" class="btn-choose-file">Choose Image</label>
                        <span id="fileNameDisplay">No file chosen</span>
                    </div>

                    <!-- Tùy chọn 2: Dùng URL -->
                    <label>Image URL:</label>
                    <input type="url" id="itemImage" placeholder="https://example.com/image.png">

                    <button type="submit" class="btn-roblox">Add Item</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/addItem.js"></script>
</body>

</html>
